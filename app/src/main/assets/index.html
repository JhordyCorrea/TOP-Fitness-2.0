<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>TOP Fitness</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--black:#080808;--gold:#c9a84c;--white:#f7f7f5}*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--white);font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:28px 18px}.brand{font-size:34px;font-weight:900;letter-spacing:3px}.brand span{color:var(--gold)}.card{margin-top:24px;padding:24px;border:1px solid #2b2b2b;border-radius:16px;background:#111;text-align:center}.status{margin-top:18px;font-size:14px;color:#aaa}.ok{color:#8fd18f}.error{color:#e28d8d}input,button{width:100%;padding:13px;border-radius:10px;margin-top:8px;font-size:15px}input{background:#0b0b0b;color:#fff;border:1px solid #333}button{border:0;background:var(--gold);font-weight:700}.secondary{background:#222;color:#fff}
</style>
</head>
<body>
<main class="wrap"><div class="brand"><span>TOP</span> FITNESS</div><section class="card"><h1>TOP Fitness</h1><p>Acceso seguro mediante Supabase.</p><div id="auth"><input id="email" type="email" placeholder="Correo electrónico"><input id="password" type="password" placeholder="Contraseña"><button onclick="login()">Entrar</button><button class="secondary" onclick="register()">Crear cuenta</button><div id="msg" class="status"></div></div><div id="status" class="status">Verificando conexión…</div></section></main>
<script>
const client=supabase.createClient('https://oxscuoilizohrxiuhwpz.supabase.co','sb_publishable_JVRIBD67vEWz1ElAY4LpJQ_nowiK7oJ',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
async function check(){const s=document.getElementById('status');try{const {data:{session}}=await client.auth.getSession();s.textContent=session?'Sesión de TOP Fitness activa':'Supabase conectado · cuenta pendiente de autenticación';s.className='status '+(session?'ok':'error')}catch(e){s.textContent='No se pudo conectar con Supabase';s.className='status error'}}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,msg=document.getElementById('msg');if(!email||!password){msg.textContent='Ingresa correo y contraseña.';return}const {error}=await client.auth.signInWithPassword({email,password});msg.textContent=error?error.message:'Acceso correcto.';await check()}
async function register(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,msg=document.getElementById('msg');if(!email||password.length<12){msg.textContent='Usa correo y una contraseña de mínimo 12 caracteres.';return}const {data,error}=await client.auth.signUp({email,password});if(error){msg.textContent=error.message;return}msg.textContent=data.session?'Cuenta creada y sesión iniciada.':'Cuenta creada. Revisa tu correo para confirmar el acceso.';await check()}
check();
</script></body></html>

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.emma.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.emma.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
